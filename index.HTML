<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Franco Hardware</title>
    <!-- Bootstrap para el diseño rápido -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <!-- Contenedor principal donde se monta la app de Vue -->
    <div id="app">
        
        <!-- Navbar con el total y el botón del carrito -->
        <nav class="navbar navbar-dark bg-dark sticky-top">
            <div class="container d-flex justify-content-between">
                <a class="navbar-brand fw-bold">FRANCO HARDWARE</a>
                <div class="d-flex align-items-center">
                    
                    <!-- Botón para abrir/cerrar el carrito usando el método toggleCarrito -->
                    <button @click="toggleCarrito" class="btn btn-link position-relative text-white me-3 p-1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        <!-- Badge que muestra la cantidad total de items, solo si hay algo en el carrito -->
                        <span id="cart-count" class="position-absolute translate-middle badge rounded-pill bg-danger" 
                              style="top: 15%; left: 85%; font-size: 0.65rem;" v-if="carrito.length > 0">
                            {{ carrito.length }}
                        </span>
                    </button>

                    <!-- Muestra el total de dinero calculado en el script -->
                    <h5 class="text-success mb-0 me-3">TOTAL: $ {{ totalDinero.toLocaleString() }}</h5>
                    
                    <!-- Botón para limpiar todo el carrito -->
                    <button @click="vaciarCarrito" class="btn btn-outline-danger btn-sm p-1" v-if="carrito.length > 0">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                            <path d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5"/>
                        </svg>
                    </button>
                </div>
            </div>
        </nav>

        <!-- Sidebar del carrito que se desliza desde la derecha -->
        <aside class="cart-sidebar" :class="{ 'open': mostrarCarrito }">
            <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-dark text-white rounded-top">
                <h6 class="mb-0 fw-bold">MI COMPRA</h6>
                <button @click="toggleCarrito" class="btn-close btn-close-white btn-sm"></button>
            </div>
            
            <div class="cart-body p-3">
                <!-- Mensaje si no hay productos (v-if) -->
                <div v-if="carrito.length === 0" class="text-center text-muted py-4">El carrito está vacío</div>
                
                <!-- Lista de productos agregados usando v-for sobre el carrito resumido -->
                <div v-for="item in carritoResumido" :key="item.nombre" class="cart-item-mini mb-3 border-bottom pb-2">
                    <div class="d-flex align-items-center mb-2">
                        <img :src="item.img" class="img-mini me-2" :alt="item.nombre">
                        <div class="flex-grow-1 overflow-hidden">
                            <p class="mb-0 fw-bold mini-text text-truncate">{{ item.nombre }}</p>
                            <p class="mb-0 text-success xsmall fw-bold">$ {{ item.precio.toLocaleString() }}</p>
                        </div>
                        <!-- Botón para borrar todas las unidades de ese producto -->
                        <button @click="eliminarProductoCompleto(item.nombre)" class="btn btn-sm text-danger border-0 p-1">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                                <path d="M11 1.5v1h3.5a.5.5 0 0 1 0 1h-.538l-.853 10.66A2 2 0 0 1 11.115 16h-6.23a2 2 0 0 1-1.994-1.84L2.038 3.5H1.5a.5.5 0 0 1 0-1H5v-1A1.5 1.5 0 0 1 6.5 0h3A1.5 1.5 0 0 1 11 1.5m-5 0v1h4v-1a.5.5 0 0 0-.5-.5h-3a.5.5 0 0 0-.5.5M4.5 5.029l.5 8.5a.5.5 0 1 0 .998-.06l-.5-8.5a.5.5 0 1 0-.998.06m6.53-.528a.5.5 0 0 0-.528.47l-.5 8.5a.5.5 0 0 0 .998.058l.5-8.5a.5.5 0 0 0-.47-.528M8 4.5a.5.5 0 0 0-.5.5v8.5a.5.5 0 0 0 1 0V5a.5.5 0 0 0-.5-.5"/>
                            </svg>
                        </button>
                    </div>
                    <!-- Controles para sumar o restar unidades dentro del carrito -->
                    <div class="d-flex justify-content-center">
                        <div class="btn-group btn-group-sm w-75 shadow-sm">
                            <button @click="quitarUno(item.nombre)" class="btn btn-danger">-</button>
                            <span class="btn btn-light disabled fw-bold text-dark">{{ item.cantidad }}</span>
                            <button @click="agregarAlCarrito(item)" class="btn btn-success">+</button>
                        </div>
                    </div>
                </div>

                <!-- Resumen final y botones de acción -->
                <div class="p-3 border-top bg-light rounded-bottom mt-2" v-if="carrito.length > 0">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fw-bold">Total:</span>
                        <span class="h5 text-success mb-0 fw-bold">$ {{ totalDinero.toLocaleString() }}</span>
                    </div>
                    <div class="d-grid gap-2">
                        <button class="btn btn-success fw-bold shadow-sm" @click="finalizarCompra">FINALIZAR COMPRA</button>
                        <button class="btn btn-outline-danger btn-sm fw-bold" @click="vaciarCarrito">VACIAR CARRITO</button>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Fondo oscuro cuando el carrito está abierto -->
        <div class="cart-overlay" v-if="mostrarCarrito" @click="toggleCarrito"></div>

        <!-- caja principal de productos -->
        <main class="container my-5">
            <div class="row">
                <!-- Llamada al componente 'producto-item' pasando props y escuchando eventos -->
                <producto-item 
                    v-for="(p, index) in productos" 
                    :key="index" :info="p"
                    :cantidad="getCantidad(p.nombre)"
                    @sumar="agregarAlCarrito(p)"
                    @restar="quitarUno(p.nombre)">
                </producto-item>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="app.js"></script>
</body>
</html>
